      pos += 4;
    }

    setUint32(0x46464952);
    setUint32(length - 8);
    setUint32(0x45564157);
    setUint32(0x20746d66);
    setUint32(16);
    setUint16(1);
    setUint16(num_of_chan);
    setUint32(abuffer.sampleRate);
    setUint32(abuffer.sampleRate * num_of_chan * 2);
    setUint16(num_of_chan * 2);
    setUint16(16);
    setUint32(0x61746164);
    setUint32(length - pos - 4);

    for (i = 0; i < abuffer.numberOfChannels; i += 1) {
      channels.push(abuffer.getChannelData(i));
    }
    while (pos < length) {
      for (i = 0; i < num_of_chan; i += 1) {
        sample = Math.max(-1, Math.min(1, channels[i][offset]));
        sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
        view.setInt16(pos, sample, true);
        pos += 2;
      }
      offset += 1;
    }
    return new Blob([buffer], { type: "audio/wav" });
  }
  // https://blog.csdn.net/qq_18643245/article/details/141157149
  function wav2Other(newSet, wavBlob, True, False) {
    const reader = new FileReader();
    reader.onloadend = async function () {
      //检测wav文件头
      const wavView = new Uint8Array(reader.result);
      const eq = function (p, s) {
        for (var i = 0; i < s.length; i++) {
          if (wavView[p + i] != s.charCodeAt(i)) {
            return false;
          }
        }
        return true;
      };
      let pcm;
      if (eq(0, "RIFF") && eq(8, "WAVEfmt ")) {
        var numCh = wavView[22];
        if (wavView[20] == 1 && (numCh == 1 || numCh == 2)) {
          //raw pcm 单或双声道
          var sampleRate =
            wavView[24] +
            (wavView[25] << 8) +
            (wavView[26] << 16) +
            (wavView[27] << 24);
          var bitRate = wavView[34] + (wavView[35] << 8);
          //搜索data块的位置
          var dataPos = 0; // 44 或有更多块
          for (var i = 12, iL = wavView.length - 8; i < iL; ) {
            if (
              wavView[i] == 100 &&
              wavView[i + 1] == 97 &&
              wavView[i + 2] == 116 &&
              wavView[i + 3] == 97
            ) {
              //eq(i,"data")
              dataPos = i + 8;
              break;
            }
            i += 4;
            i +=
              4 +
              wavView[i] +
              (wavView[i + 1] << 8) +
              (wavView[i + 2] << 16) +
              (wavView[i + 3] << 24);
          }
          console.log("wav info", sampleRate, bitRate, numCh, dataPos);
          if (dataPos) {
            if (bitRate == 16) {
              pcm = new Int16Array(wavView.buffer.slice(dataPos));
            } else if (bitRate == 8) {
              pcm = new Int16Array(wavView.length - dataPos);
              //8位转成16位
              for (var j = dataPos, d = 0; j < wavView.length; j++, d++) {
                var b = wavView[j];
                pcm[d] = (b - 128) << 8;
              }
            }
          }
          if (pcm && numCh == 2) {
            //双声道简单转单声道
            var pcm1 = new Int16Array(pcm.length / 2);
            for (var i = 0; i < pcm1.length; i++) {
              pcm1[i] = (pcm[i * 2] + pcm[i * 2 + 1]) / 2;
            }
            pcm = pcm1;
          }
        }
      }
      if (!pcm) {
        False && False("非单或双声道wav raw pcm格式音频，无法转码");
        return;
      }
      await __wx_load_script(__wx_assets_base + "/lib/recorder.min.js");
      var rec = Recorder(newSet).mock(pcm, sampleRate);
      rec.stop(function (blob, duration) {
        True(blob, duration, rec);
      }, False);
    };
    reader.readAsArrayBuffer(wavBlob);
  }

  async function wavBlobToMP3(wavBlob) {
    return new Promise((resolve) => {
      if (!wavBlob) {
        resolve([new Error("Missing the wav blob"), null]);
        return;
      }
      var set = {
        type: "mp3",
        sampleRate: 48000,
        bitRate: 96,
      };
      wav2Other(
        set,
        wavBlob,
        function (blob) {
          resolve([null, blob]);
        },
        function (msg) {
          resolve([new Error(msg || "Conversion failed"), null]);
        },
      );
    });
  }
  /**
   * 支持回调的下载
   * @param {Response} response
   * @param {{ onStart: (v: { total_size: number }) => void, onProgress: (v: { loaded_size: number, progress: number | null }) => void, onEnd: (v: { blob: Blob }) => void }} handlers
   */
  async function download_with_progress(response, handlers) {
    var content_length = response.headers.get("Content-Length");
    var chunks = [];
    var total_size = content_length ? parseInt(content_length, 10) : 0;
    if (total_size) {
      if (handlers.onStart) {
        handlers.onStart({ total_size });
      }
    }
    var loaded_size = 0;
    var reader = response.body.getReader();
    while (true) {
      var { done, value } = await reader.read();
      if (done) {
        break;
      }
      chunks.push(value);
      loaded_size += value.length;
      if (handlers.onProgress) {
        handlers.onProgress({
          loaded_size,
          progress: total_size
            ? Number(((loaded_size / total_size) * 100).toFixed(2))
            : null,
        });
      }
    }
    var blob = new Blob(chunks);
    if (handlers.onEnd) {
      handlers.onEnd({ blob });
    }
    return blob;
  }

    observe_node(selector, cb) {
      var $existing = document.querySelector(selector);
      if ($existing) {
        cb($existing);
        return;
      }
      var observer = new MutationObserver((mutations, obs) => {
        mutations.forEach((mutation) => {
          if (mutation.type === "childList") {
            mutation.addedNodes.forEach((node) => {
              if (node.nodeType === 1) {
                if (node.matches(selector) || node.querySelector(selector)) {
                  cb(
                    node.matches(selector)
                      ? node
                      : node.querySelector(selector),
                  );
                  if (document.querySelector(selector)) {
                    obs.disconnect();
                  }
                }
              }
            });
          }
        });
      });
      WXU.onWindowLoaded(() => {
        const $root = document.getElementById("app");
        if (!$root) {
          return;
        }
        observer.observe($root, {
          childList: true,
          subtree: true,
        });
      });
    },
    /**
     * @param {{ url: string; method: 'GET' | 'POST'; body?: any }} opt
     */
    async request(opt) {
      return new Promise((resolve, reject) => {
        var xhr = new XMLHttpRequest();
        xhr.open(opt.method, opt.url);
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.onload = async function () {
          // console.log("[request]xhr.responseText", xhr.responseText);
          try {
            var data = JSON.parse(xhr.responseText);
            if (data.code !== 0) {
              resolve([new Error(data.msg), null]);
              return;
            }
            resolve([null, data.data]);
          } catch (e) {
            // ignore
          }
          resolve([null, xhr.responseText]);
        };
        xhr.onerror = function (err) {
          // console.log("[request]xhr.onerror", err);
          resolve([new Error(err.type), null]);
        };
        xhr.send(JSON.stringify(opt.body));
      });

function getShortUri(data) {
  var u = new URL(decodeURIComponent(data.url));
  var pathname = u.pathname;
  var m = pathname.match(/\/sph\/([a-zA-Z0-9]{1,})/);
  if (m) {
    return m[1];
  }
  return u.searchParams.get("id");
}
async function fetchExportIdWithShareId(data) {
  if (!data.url) {
    return [new Error("missing url"), null];
  }
  var uri = getShortUri(data);
  if (!uri) {
    return [new Error("can't get the uri from url, " + data.url), null];
  }
  await WXU.load_script(__wx_assets_base + "/lib/axios.min.js");
  await WXU.load_script(__wx_assets_base + "/lib/getFeedInfo.js");
  // await WXU.load_script(__wx_assets_base + "/lib/merlin.js");
  if (typeof getFeedInfo !== "function") {
    return [new Error("the getFeedInfo is not a function"), null];
  }
  var payload = {
    baseReq: {
      generalToken: "",
    },
    shortUri: uri,
  };
  /** @type {SharedFeedProfileResp} */
  try {
    var shared = await getFeedInfo(payload);
    if (!shared.data.sceneInfo.dynamicExportId) {
      return [
        new Error("getFeedInfo failed, missing 'sceneInfo.dynamicExportId'"),
        null,
      ];
    }
    return [null, shared.data.sceneInfo.dynamicExportId];
  } catch (err) {
    return [err, null];
  }
}
async function fetchFeedProfileWith(data) {
  if (data.url) {
    if (data.url.match(/sph/)) {
      var [err, eid] = await fetchExportIdWithShareId(data);
      if (err) {
        return [err, null];
      }
      data.eid = eid;
    } else {
      var u = new URL(decodeURIComponent(data.url));
      data.oid = WXU.API.decodeBase64ToUint64String(u.searchParams.get("oid"));
      data.nid = WXU.API.decodeBase64ToUint64String(u.searchParams.get("nid"));
    }
  }
  let payload = {
    needObject: 1,
    lastBuffer: "",
    scene: data.eid ? 141 : 146,
    direction: 2,
    identityScene: 2,
    pullScene: 6,
    objectid: (() => {
      if (data.eid) {
        return undefined;
      }
      if (data.oid.includes("_")) {
        return data.oid.split("_")[0];
      }
      return data.oid;
    })(),
    objectNonceId: data.eid ? undefined : data.nid,
    encrypted_objectid: data.eid || "",
  };
  if (data.eid) {
    payload.traceBuffer = undefined;
  }
  try {
    var r = await WXU.API.finderGetCommentDetail(payload);
    return [null, r];
  } catch (err) {
    return [err, null];
  }
}

function ChannelsWebsocketClient() {
  const methods = {
    connect_local_ws() {
      const ws_url =
        WSServerProtocol + "://" + FakeLocalAPIServerAddr + "/ws/channels";
      const ws = new WebSocket(ws_url);
      ws.onclose = (e) => {
        WXU.error({ msg: "channels ws连接已关闭，" + JSON.stringify(e) });
      };
      ws.onerror = (e) => {
        WXU.error({ msg: "channels ws连接发生错误，" + JSON.stringify(e) });
      };
      ws.onmessage = (ev) => {
        const [err, msg] = WXU.parseJSON(ev.data);
        if (err) {
          return;
        }
        if (msg.type === "api_call") {
          this.__wx_handle_api_call(msg.data, ws);
        }
      };
    },
    async __wx_handle_api_call(msg, socket) {
      var { id, key, data } = msg;
      console.log("[DOWNLOADER]__wx_handle_api_call", id, key, data);
      function resp(body) {
        socket.send(
          JSON.stringify({
            id,
            data: body,
          }),
        );
      }
      if (key === "key:channels:contact_list") {
        let payload = {
          query: data.keyword,
          scene: 13,
          lastBuff: data.next_marker
            ? decodeURIComponent(data.next_marker)
            : "",
          requestId: String(new Date().valueOf()),
        };
        var r = await WXU.API2.finderSearch(payload);
        console.log("[DOWNLOADER]finderSearch", r, payload);
        /** @type {SearchResp} */
        var { infoList, objectList } = r.data;
        resp({
          ...r,
          payload,
        });
        return;
      }
      if (key === "key:channels:feed_list") {
        let payload = {
          username: data.username,
          finderUsername: __wx_username,
          lastBuffer: data.next_marker
            ? decodeURIComponent(data.next_marker)
            : "",
          needFansCount: 0,
          objectId: "0",
        };
        let r = await WXU.API.finderUserPage(payload);
        console.log("[DOWNLOADER]finderUserPage", r);
        /** @type {ChannelsObject[]} */
        const object = r.data.object || [];
        resp({
          ...r,
          payload,
        });
        return;
      }
      if (key === "key:channels:live_replay_list") {
        let payload = {
          username: data.username,
          finderUsername: __wx_username || data.username,
          lastBuffer: data.next_marker
            ? decodeURIComponent(data.next_marker)
            : "",
          needFansCount: 0,
          objectId: "0",
        };
        var r = await WXU.API3.finderLiveUserPage(payload);
        console.log("[DOWNLOADER]finderLiveUserPage", r);
        resp({
          ...r,
          payload,
        });
        return;
      }
      if (key === "key:channels:interactioned_list") {
        let payload = {
          lastBuffer: data.next_marker
            ? decodeURIComponent(data.next_marker)
            : "",
          tabFlag: data.flag ? Number(data.flag) : 7,
        };
        var r = await WXU.API4.finderGetInteractionedFeedList(payload);
        console.log("[DOWNLOADER]finderGetInteractionedFeedList", r);
        resp({
          ...r,
          payload,
        });
        return;
      }
      if (key === "key:channels:feed_profile") {
        console.log("before finderGetCommentProfile", data);
        var [err, r] = await fetchFeedProfileWith(data);
        if (err) {
          resp({
            errCode: 1011,
            errMsg: err.message,
            payload: null,
          });
        }
        /** @type {MediaProfileResp} */
        var { object } = r.data;
        resp({
          ...r,
          payload,
        });
      }
      if (key === "key:channels:shared_feed_profile") {
        console.log("before getFeedInfo", data);
        try {
          var [error, dynamicExportId] = await fetchExportIdWithShareId(data);
          if (error) {
            resp({
              errCode: 1011,
              errMsg: error.message,
              payload: null,
            });
            return;
          }
          var r = await fetchFeedProfileWith({
            eid: dynamicExportId,
          });
          var { object } = r.data;
          resp({
            ...r,
            payload,
          });
          return;
        } catch (err) {
          resp({
            errCode: 1011,
            errMsg: err.message,
            payload: null,
          });
          return;
        }
      }
      if (key === "key:channels:fetch_feed_comment_list") {
        // console.log("[DOWNLOADER]key:channels:fetch_feed_comment_list");
        if (!data.oid) {
          resp({
            errCode: 1011,
            errMsg: "missing oid",
            payload: null,
          });
          return;
        }
        if (!data.nid && !data.comment_id) {
          resp({
            errCode: 1011,
            errMsg: "missing nid or comment_id",
            payload: null,
          });
          return;
        }
        try {
          var payload = data.comment_id
            ? {
                direction: 2,
                identityScene: 2,
                objectId: data.oid,
                lastBuffer:
                  data.next_marker === "" ? undefined : data.next_marker,
                rootCommentId: data.comment_id,
              }
            : {
                finderBasereq: {
                  scene: 140,
                  ctxInfo: {
                    clientReportBuff: '{"entranceId":"1002"}',
                  },
                  objectBaseInfos: [],
                },
                objectId: data.oid,
                direction: 2,
                objectNonceId: data.nid,
                identityScene: 2,
                lastBuffer:
                  data.next_marker === "" ? undefined : data.next_marker,
                enterSessionId: String(Date.now()),
              };
          var r = await WXU.API.finderGetCommentList(payload);
          resp({
            ...r,
            payload,
          });
        } catch (err) {
          resp({
            errCode: 1011,
            errMsg: err.message,
            payload: null,
          });
        }
        return;
      }
      if (key === "key:channels:reload") {
        console.log("[DOWNLOADER]reloading page");
        resp({
          msg: "reloading",
        });
        setTimeout(() => {
          window.location.reload();
        }, 500);
        return;
      }
      resp({
        errCode: 1000,
        errMsg: "未匹配的key",
        payload: msg,
      });
    },
  };
  return {
    methods,
  };
}

    });
}

      statusText = "已完成";

      statusText = "下载失败";

    if (isRunning || isPaused) {

             <svg width="50" height="50" style="position: absolute; top: 0; left: 0; transform: rotate(-90deg);">

                : ""
            }
            ${progressDisplay}
          </div>
          ${actionHtml}
      `;
    container.appendChild(item);
  });

  if (list.length > 0) {

}

function Waterfall(props) {
  const { store, class: cls, render, ...rest } = props;

  return WaterfallPrimitive.Root(
    {
      ...rest,
      store,
      class: cn(["w-full h-full overflow-y-auto", cls]),
    },
    [
      For({
        each: store.$columns,
        render(column) {
          const visible_cells = refarr([...column.$cells]);
          return WaterfallPrimitive.Column({ store: column }, [
            For({
              key: "id",
              each: visible_cells,
              render(slot) {
                let payload = slot.state.payload;
                let user_content = slot.state.bound
                  ? render(payload, slot)
                  : null;

                const cell$ = WaterfallPrimitive.Cell(
                  { store: slot },
                  user_content ? [user_content] : [],
                );

                // 监听 rebind — 替换内部用户内容
                slot.onRebind(() => {
                  const cellDiv = cell$.$elm;
                  if (!cellDiv) return;

                  // 卸载旧内容
                  if (
                    user_content &&
                    typeof user_content.onUnmounted === "function"
                  ) {
                    user_content.onUnmounted();
                  }
                  // 清空 Cell div 内部（保留 Cell div 本身在 Column 中的位置不变）
                  while (cellDiv.firstChild) {
                    cellDiv.removeChild(cellDiv.firstChild);
                  }

                  // 创建并挂载新内容
                  payload = slot.state.payload;
                  user_content = render(payload, slot);
                  if (user_content && isElement(user_content)) {
                    const rendered = user_content.render();
                    if (rendered) {
                      cellDiv.appendChild(rendered);
                    }
                    if (typeof user_content.onMounted === "function") {
                      user_content.onMounted(user_content.$elm);
                    }
                  }
                });

                return cell$;
              },
            }),
          ]);
        },
      }),
    ],
  );
}

function ScrollView(props, children) {
  const { store, class: cls, ...rest } = props;

  return ScrollViewPrimitive.Root(
    {
      ...rest,
      store,

function DownloaderPanelViewModel() {

        };
        ws.onerror = (e) => {
          if (WXU.downloader && WXU.downloader.status !== "connected") {
            reject(e);
          }
        };
        ws.onmessage = (ev) => {
          const [err, msg] = WXU.parseJSON(ev.data);
          if (err) {
            return;
          }
          if (msg.type === "batch_tasks") {
            const list = Array.isArray(msg.data) ? msg.data : [];
            const tasks = list.map((t) => methods.formatTask(t));
            methods.batchInsert(tasks);
            return;
          }
          if (msg.type === "event") {
            const data = msg && msg.data ? msg.data : null;
            if (!data || !data.Key) {
              return;
            }
            if (data.Key === "delete") {
              return;
            }
            const task = data.Task || data.task; // 兼容大小写字段
            if (!task) {
              return;
            }
            methods.upsert(methods.formatTask(task));
          }
        };
      });
    },
    batchInsert(tasks) {
      if (!tasks || !tasks.length) return;
      const newTasks = [];
      for (let i = 0; i < tasks.length; i++) {
        const t = tasks[i];
        if (!t || !t.id) continue;
        const matched = tasks_.find((v) => v.id === t.id);
        if (matched) {
          matched.assign(t);
        } else {
          newTasks.push(t);
        }
      }
      if (newTasks.length) {
        tasks_.unshift(...newTasks);
        task_count_.as((prev) => prev + newTasks.length);
        ui.waterfall$.methods.unshiftItems(newTasks);
        const addedHeight = newTasks.length * (ITEM_HEIGHT + GUTTER);
        ui.view$.addScrollTop(addedHeight);
      }
    },
    upsert(task) {
      console.log("[]upsert task", task);
      if (!task || !task.id) {
        return;
      }
      const matched = tasks_.find((v) => v.id === task.id);
      if (!matched) {
        console.log("[]insert task", task);
        task_count_.as((prev) => {
          return prev + 1;
        });
        tasks_.unshift(task);
        // ui.waterfall$.methods.appendItems([task]);
        ui.waterfall$.methods.unshiftItems([task]);
        const addedHeight = 1 * ITEM_HEIGHT + GUTTER;
        ui.view$.addScrollTop(addedHeight);
        return;
      }
      console.log("[]update task", task);
      matched.assign(task);
    },
  };

  list$.onDataSourceAdded((list) => {
    const tasks = list;
    tasks_.push(...tasks);
    ui.waterfall$.methods.appendItems(tasks);
  });
  list$.onError((err) => {
    WXU.error({
      msg: err.message,
    });
  });
  let _scrollTop = 0;
  const ui = {
    view$: new Timeless.ui.ScrollViewCore({
      onScroll(pos) {
        _scrollTop = pos.scrollTop;
        ui.waterfall$.methods.handleScroll({ scrollTop: pos.scrollTop });
      },
      async onReachBottom() {
        if (list$.response.loading) {
          return;
        }
        if (list$.response.noMore) {
          ui.view$.finishLoadingMore();
          return;
        }
        await list$.loadMore();
        ui.view$.finishLoadingMore();
      },
    }),
    waterfall$: Timeless.ui.WaterfallModel({
      column: 1,
      size: _pageSize,
      buffer: 10,
      gutter: GUTTER,
    }),
    dropdown$: new Timeless.ui.DropdownMenuCore({
      trigger: "hover",
      align: "end",
      items: [
        new Timeless.ui.MenuItemCore({
          label: "清空下载记录",
          async onClick() {
            await methods.clearTasks();
            ui.dropdown$.hide();
          },
        }),
        // new Timeless.ui.MenuItemCore({
        //   label: "刷新",
        //   async onClick() {
        //     list$.clear();
        //     tasks_.as([]);
        //     task_count_.as(0);
        //     ui.waterfall$.methods.cleanColumns();
        //     const r = await list$.init();
        //     if (r.error) {
        //       WXU.error({ msg: r.error.message });
        //       ui.dropdown$.hide();
        //       return;
        //     }
        //     const tasks = list$.response.dataSource;
        //     tasks_.push(tasks);
        //     task_count_.as(list$.response.total);
        //     ui.waterfall$.methods.appendItems(tasks);
        //     ui.dropdown$.hide();
        //   },
        // }),
      ],
    }),
  };
  let ready = false;
  return {
    ui,
    state: {
      tasks: tasks_,
      task_count: task_count_,
      running_count: running_count_,
      get scrollTop() {
        return _scrollTop;
      },
    },
    methods,
    async ready() {
      if (ready) {
        return;
      }
      WXU.downloader.status = "disconnected";
      WXU.downloader.reconnect = async function () {
        if (WXU.downloader.status === "connected") return true;
        for (let i = 0; i < 3; i++) {
          try {
            await list$.init();
            return true;
          } catch (e) {
            console.warn("Reconnect attempt " + (i + 1) + " failed");
            await new Promise((r) => setTimeout(r, 1000));
          }
        }
        return false;
      };
      methods.connect();
      const r = await list$.init();
      if (r.error) {
        WXU.error({
          msg: r.error.message,
        });
        return;
      }
      const tasks = list$.response.dataSource;
      tasks_.push(...tasks);
      task_count_.as(list$.response.total);
      console.log("before waterfall$.methods.appendItems", tasks);
      ui.waterfall$.methods.appendItems(tasks);
      ready = true;
    },
    clean() {
      tasks_.as([]);
      task_count_.as(0);
      list$.clear();
      ui.waterfall$.methods.cleanColumns();
    },
  };
}

function DownloaderPanelView(props, children) {
  // const vm$ = props.store;
  const vm$ = DownloaderPanelViewModel();
  const tasks_ = vm$.state.tasks;
  const task_count_ = vm$.state.task_count;
  const running_count_ = vm$.state.running_count;

  return View(
    {
      class: "wx-dl-panel-container",
      onMounted() {
        vm$.ready();
      },
      onUnmounted() {
        // vm$.clean();
      },
    },
    [
      View({ class: "wx-dl-header" }, [
        View({ class: "wx-dl-title" }, [
          "Downloads",
          computed(task_count_, (d) => {
            return d > 0 ? `（${d}）` : "";
          }),
        ]),
        DropdownMenu(
          {
            store: vm$.ui.dropdown$,
          },
          [
            View(
              {
                class: "wx-dl-more-btn",
              },
              [
                Timeless.icons.EllipsisVerticalOutlined({
                  style: "font-size: 18px;",
                }),
              ],
            ),
          ],
        ),
      ]),
      View(
        {
          class: "wx-dl-list wx-dl-dark-scroll",
        },
        [
          ScrollView(
            {
              style: "background-color: transparent; margin-top: 0;",
              store: vm$.ui.view$,
            },
            [
              Show(
                {
                  when: computed(task_count_, (d) => d > 0),
                  fallback: [
                    View(
                      {
                        class: "weui-loadmore weui-loadmore_line",
                      },
                      [
                        View(
                          {
                            class: "weui-loadmore__tips",
                          },
                          ["暂无下载任务"],
                        ),
                      ],
                    ),
                  ],
                },
                [
                  Waterfall({
                    store: vm$.ui.waterfall$,
                    class: "scroll-view-waterfall !overflow-visible !h-auto",
                    style: "overflow: visible; height: auto;",
                    render(task) {
                      console.log("task in waterfall", task);
                      const iconSize = "50px";
                      const state_ = computed(task, (t) => {
                        // console.log("the task is changed", t.status);
                        const pr = format_download_percent(t);
                        const isCompleted =
                          t.status === "done" ||
                          t.status === "completed" ||
                          t.status === "success" ||
                          t.status === "finished" ||
                          (pr === 100 && t.status !== "running");

                        const isPaused =
                          t.status === "paused" || t.status === "pause";
                        const isRunning = t.status === "running";

                        let statusText = t.status;
                        let statusColor = "var(--weui-FG-1)";
                        var isFailed =
                          t.status === "failed" || t.status === "error";
                        var isPending = t.status === "pending";
                        if (isRunning) {
                          const speed = format_download_speed(
                            t.progress ? t.progress.speed : 0,
                          );
                          statusText = `${speed} • ${pr}%`;
                        } else if (isCompleted) {
                          statusText = "已完成";
                          // Calculate size
                          const total =
                            t.meta && t.meta.res ? t.meta.res.size : 0;
                          if (total) {
                            statusText = WXU.bytes_to_size(total);
                          }
                        } else if (isFailed) {
                          statusText = "下载失败";
                          statusColor = "#FA5151";
                        } else if (isPending) {
                          statusText = "等待中...";
                        } else if (isPaused) {
                          statusText = `已暂停 • ${pr}%`;
                        }
                        return {
                          pr,
                          isCompleted,
                          isPaused,
                          isRunning,
                          isFailed,
                          canResume: isFailed || isPaused,
                          statusText,
                          statusColor,
                        };
                      });
                      const isOpenExternal = WXU.config.remoteServerEnabled;
                      const filename = task.name;
                      const PrefixIcon = computed(filename, (t) => {
                        const filename = t;
                        let selectedIcon = FileIcon;
                        if (filename) {
                          const ext = filename.split(".").pop().toLowerCase();
                          if (ext === "mp3") {
                            selectedIcon = MP3Icon;
                          } else if (ext === "mp4") {
                            selectedIcon = MP4Icon;
                          } else if (
                            ["jpg", "jpeg", "png", "gif", "webp"].includes(ext)
                          ) {
                            selectedIcon = ImageIcon;
                          }
                        }
                        return selectedIcon
                          .replace('width="20"', 'width="32"')
                          .replace('height="20"', 'height="32"');
                      });
                      const radius = 22;
                      const circumference = 2 * Math.PI * radius;
                      const offset = computed(state_, (d) => {
                        return circumference - (d.pr / 100) * circumference;
                      });
                      const strokeColor = computed(state_, (d) => {
                        return d.isPaused ? "#FBC02D" : "#07C160";
                      });

                      return View({ class: "weui-cell wx-dl-item" }, [
                        View(
                          {
                            class: "weui-cell__hd",
                            style: `position: relative; margin-right: 16px; width: ${iconSize}; height: ${iconSize}; display: flex; align-items: center; justify-content: center; color: var(--weui-FG-0);`,
                          },
                          [
                            Show(
                              {
                                when: computed(state_, (t) => {
                                  return t.isRunning || t.isPaused;
                                }),
                                fallback: [
                                  DangerouslyInnerHTML(PrefixIcon.value),
                                ],
                              },
                              [
                                View(
                                  {
                                    style:
                                      "position: relative; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;",
                                  },
                                  [
                                    SVG(
                                      {
                                        style:
                                          "position: absolute; top: 0; left: 0; transform: rotate(-90deg);",
                                        width: "50",
                                        height: "50",
                                        viewBox: "0 0 50 50",
                                      },
                                      [
                                        Circle({
                                          cx: "25",
                                          cy: "25",
                                          r: radius,
                                          stroke: "var(--weui-FG-3)",
                                          "stroke-width": "3",
                                          fill: "none",
                                        }),
                                        Circle({
                                          cx: "25",
                                          cy: "25",
                                          r: radius,
                                          stroke: strokeColor,
                                          "stroke-width": "3",
                                          fill: "none",
                                          "stroke-dasharray": circumference,
                                          "stroke-dashoffset": offset,
                                          "stroke-linecap": "round",
                                        }),
                                      ],
                                    ),
                                    View(
                                      {
                                        style:
                                          "position: relative; z-index: 1; display: flex;",
                                      },
                                      [DangerouslyInnerHTML(PrefixIcon.value)],
                                    ),
                                  ],
                                ),
                              ],
                            ),
                          ],
                        ),
                        View(
                          {
                            class: "weui-cell__bd",
                            style: "min-width:0;",
                          },
                          [
                            View(
                              {
                                class: "weui-ellipsis",
                                style:
                                  "color: var(--weui-FG-0); font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;",
                              },
                              [computed(task, (t) => t.name)],
                            ),
                            View(
                              {
                                class: "weui-cell__desc",
                                style: computed(state_, (d) => {
                                  return `margin-top: 4px; color: ${d.statusColor}; font-size: 12px;`;
                                }),
                              },
                              [
                                computed(state_, (d) => {
                                  return d.statusText;
                                }),
                              ],
                            ),
                          ],
                        ),
                        View(
                          {
                            class: "weui-cell__ft",
                            style: "display: flex; align-items: center;",
                          },
                          (() => {
                            const btnStyle =
                              "color: var(--weui-FG-0); opacity: 0.8; margin-left: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center;";
                            return [
                              Switch(
                                {
                                  when: combine(
                                    {
                                      state: state_,
                                      running_count: running_count_,
                                    },
                                    (t) => {
                                      if (t.state.isCompleted) {
                                        return 1;
                                      }
                                      if (t.state.isRunning) {
                                        return 2;
                                      }
                                      if (t.state.isPaused) {
                                        return 3;
                                      }
                                      if (t.state.isFailed) {
                                        return 4;
                                      }
                                      return 0;
                                    },
                                  ),
                                },
                                [
                                  // 场景 1: 已完成 -> 显示打开按钮
                                  Match(1, [
                                    Timeless.h(
                                      View,
                                      {
                                        type: "a",
                                        class: "wx-download-item-open",
                                        style: btnStyle,
                                        onClick() {
                                          vm$.methods.openTask(task);
                                        },
                                      },
                                      [
                                        Show(
                                          {
                                            when: !!isOpenExternal,
                                            fallback: [
                                              DangerouslyInnerHTML(FolderIcon),
                                            ],
                                          },
                                          [
                                            DangerouslyInnerHTML(
                                              ExternalLinkIcon,
                                            ),
                                          ],
                                        ),
                                      ],
                                    ),
                                  ]),
                                  // 场景 2: 正在运行 -> 显示暂停按钮
                                  Match(2, [
                                    Timeless.h(
                                      View,
                                      {
                                        type: "a",
                                        class: "wx-download-item-pause",
                                        style: btnStyle,
                                        onClick() {
                                          vm$.methods.pauseTask(task);
                                        },
                                      },
                                      [DangerouslyInnerHTML(PauseIcon)],
                                    ),
                                  ]),
                                  // 场景 3: 暂停或失败且未达最大并发 -> 显示恢复按钮
                                  Match(3, [
                                    Timeless.h(
                                      View,
                                      {
                                        type: "a",
                                        class: "wx-download-item-resume",
                                        style: Timeless.sn([
                                          btnStyle,
                                          computed(running_count_, (t) => {
                                            return t > WXU.config.MaxRunning
                                              ? "opacity: 0.6; cursor: not-allowed;"
                                              : "";
                                          }),
                                        ]),
                                        onClick() {
                                          vm$.methods.resumeTask(task);
                                        },
                                      },
                                      [DangerouslyInnerHTML(PlayIcon)],
                                    ),
                                  ]),
                                  Match(4, [
                                    Timeless.h(
                                      View,
                                      {
                                        type: "a",
                                        class: "wx-download-item-resume",
                                        style: Timeless.sn([
                                          btnStyle,
                                          computed(running_count_, (t) => {
                                            return t > WXU.config.MaxRunning
                                              ? "opacity: 0.6; cursor: not-allowed;"
                                              : "";
                                          }),
                                        ]),
                                        onClick() {
                                          vm$.methods.resumeTask(task);
                                        },
                                      },
                                      [DangerouslyInnerHTML(RetryIcon)],
                                    ),
                                  ]),
                                ],
                              ),
                              View(
                                {
                                  type: "a",
                                  class: "wx-download-item-delete",
                                  style: btnStyle,
                                  onClick() {
                                    vm$.methods.deleteTask(task);
                                  },
                                },
                                [DangerouslyInnerHTML(DeleteIcon)],
                              ),
                            ];
                          })(),
                        ),
                      ]);
                    },
                  }),
                ],
              ),
            ],
          ),
        ],
      ),
    ],
  );
}

(() => {
  function insert_downloader($wrap, $trigger) {
    $wrap.insertBefore($trigger, $wrap.firstChild);
    const popover$ = new Timeless.ui.PopoverCore({
      offsetY: 4,
      destroyOnClose: false,
    });
    WXU.downloader.show = function () {
      popover$.show();
    };
    WXU.downloader.hide = function () {
      popover$.hide();
    };
    WXU.downloader.toggle = function () {
      popover$.toggle();
    };
    Timeless.render(DownloaderEntry({ popover$ }), $trigger);
  }
  let mounted = false;
  if (window.location.pathname === "/web/pages/profile") {
    WXU.observe_node(".page-profile", () => {
      var $page = document.querySelector(".page-profile");
      if (mounted) return;
      if (!$page) return;

      insert_downloader($box, $btn_wrap);
      mounted = true;
    });
  } else if (window.location.hostname === "mp.weixin.qq.com") {
    //
  } else {
    WXU.observe_node(".home-header", () => {
      var $header = document.querySelector(".home-header");
      console.log("[DOWNLOADER]insert_downloader", mounted, $header);
      if (mounted) return;
      if (!$header) return;
      var $box = $header.children[$header.children.length - 1];

        $btn_wrap = $box;
      }
      var $download_panel_button = download_btn7();
      insert_downloader($btn_wrap, $download_panel_button);
      mounted = true;
    });
  }
})();
